<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04050a">
<title>Солнечная система — интерактивная карта</title>
<style>
  :root{
    --bg:#04050a;--panel-bg:linear-gradient(165deg,rgba(18,23,40,.96),rgba(7,9,17,.98));
    --border:rgba(120,170,255,.16);--text:#dfe7f5;--muted:#8fa6c9;--muted-2:#7b8fb0;
    --accent:#7fb2ff;--panel-w:min(430px,94vw);--pad:clamp(20px,3.2vw,34px);
    --title:clamp(24px,3.6vw,32px);--body:clamp(13.5px,1.55vw,14.5px);
    --stat-b:clamp(13px,1.7vw,14.5px);--safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);--safe-r:env(safe-area-inset-right,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);
    font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;color:var(--text);overscroll-behavior:none}
  #sky{display:block;width:100vw;height:100vh;height:100dvh;cursor:default;touch-action:none}
  #hint{position:fixed;left:50%;bottom:calc(26px + var(--safe-b));transform:translateX(-50%);
    color:var(--muted);font-size:clamp(12px,1.5vw,13.5px);letter-spacing:.3px;
    background:rgba(10,15,28,.6);border:1px solid rgba(110,160,255,.18);
    padding:10px 20px;border-radius:100px;backdrop-filter:blur(8px);pointer-events:none;
    transition:opacity .6s,transform .6s;animation:pulseHint 3s ease-in-out infinite;
    max-width:calc(100vw - 32px);text-align:center;line-height:1.4;z-index:5}
  #hint.hide{opacity:0;transform:translateX(-50%) translateY(12px)}
  @keyframes pulseHint{0%,100%{opacity:.75}50%{opacity:1}}
  #panel{position:fixed;top:0;right:0;height:100%;height:100dvh;width:var(--panel-w);
    padding:calc(44px + var(--safe-t)) var(--pad) calc(40px + var(--safe-b));
    padding-right:calc(var(--pad) + var(--safe-r));background:var(--panel-bg);
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    border-left:1px solid var(--border);box-shadow:-40px 0 80px rgba(0,0,0,.65);
    transform:translateX(106%);transition:transform .5s cubic-bezier(.22,.9,.3,1);
    overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;z-index:10}
  #panel.open{transform:translateX(0)}
  #panel::-webkit-scrollbar{width:6px}
  #panel::-webkit-scrollbar-thumb{background:rgba(120,170,255,.25);border-radius:3px}
  #close{position:absolute;top:calc(18px + var(--safe-t));right:calc(20px + var(--safe-r));
    width:44px;height:44px;min-width:44px;min-height:44px;border-radius:50%;
    border:1px solid rgba(140,180,255,.22);background:rgba(255,255,255,.04);
    color:#9fb6d8;font-size:20px;line-height:1;cursor:pointer;transition:.25s;
    display:flex;align-items:center;justify-content:center;padding:0}
  #close:hover,#close:focus-visible{background:rgba(255,255,255,.12);color:#fff;transform:rotate(90deg)}
  #close:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .orb{width:clamp(64px,9vw,88px);height:clamp(64px,9vw,88px);border-radius:50%;
    margin-bottom:clamp(18px,2.6vw,26px);
    background:radial-gradient(circle at 33% 30%, #fff6, transparent 62%), var(--accent);
    box-shadow:0 0 26px -4px var(--accent),0 0 60px -10px var(--accent),
      inset -14px -12px 26px rgba(0,0,0,.55);animation:orbFloat 6s ease-in-out infinite}
  @keyframes orbFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  #pName{margin:0 0 6px;font-size:var(--title);font-weight:600;letter-spacing:.3px;
    background:linear-gradient(90deg,#fff,var(--accent));-webkit-background-clip:text;
    background-clip:text;color:transparent;line-height:1.15}
  #pType{margin:0 0 clamp(18px,2.4vw,26px);font-size:clamp(10.5px,1.35vw,12.5px);
    letter-spacing:2.2px;text-transform:uppercase;color:var(--muted-2)}
  #pStats{display:grid;grid-template-columns:1fr 1fr;gap:clamp(7px,1vw,10px);
    margin-bottom:clamp(16px,2.2vw,24px)}
  .stat{background:rgba(255,255,255,.035);border:1px solid rgba(120,170,255,.12);
    border-radius:12px;padding:clamp(9px,1.2vw,11px) clamp(11px,1.4vw,13px);min-width:0}
  .stat span{display:block;font-size:clamp(9.5px,1.15vw,10.5px);letter-spacing:.8px;
    text-transform:uppercase;color:var(--muted-2);margin-bottom:5px;line-height:1.3}
  .stat b{font-size:var(--stat-b);font-weight:600;color:#eaf1ff;line-height:1.3;word-break:break-word}
  #pDesc{font-size:var(--body);line-height:1.72;color:#a8b8d2;margin:0 0 16px}
  #pDesc:last-child{margin-bottom:0}
  @media (max-width:560px){:root{--panel-w:100vw;--pad:22px}
    #panel{border-left:none;box-shadow:0 -20px 60px rgba(0,0,0,.7);padding-top:calc(56px + var(--safe-t))}
    #pStats{gap:8px}.stat span{font-size:9.5px}}
  @media (max-width:360px){:root{--pad:18px;--title:22px}#pStats{gap:6px}.stat{padding:8px 9px}}
  @media (min-width:768px) and (max-width:1024px){:root{--panel-w:min(400px,80vw);--pad:26px}}
  @media (min-width:1920px){:root{--panel-w:min(520px,80vw);--pad:40px;--title:38px;--body:16px;--stat-b:16px}
    .stat span{font-size:11.5px}#pType{font-size:13px}}
  @media (min-width:2560px){:root{--panel-w:min(640px,80vw);--pad:52px;--title:46px;--body:19px;--stat-b:19px}
    #pStats{grid-template-columns:1fr 1fr 1fr}.stat span{font-size:13px}#pType{font-size:15px;letter-spacing:2.8px}
    #close{width:56px;height:56px;font-size:24px}}
  @media (min-width:3840px){:root{--panel-w:min(900px,80vw);--pad:72px;--title:64px;--body:26px;--stat-b:26px}
    #pStats{grid-template-columns:1fr 1fr 1fr}.stat span{font-size:18px}#pType{font-size:20px}
    #hint{font-size:20px;padding:16px 32px}}
  @media (max-height:500px) and (orientation:landscape){:root{--pad:20px}
    .orb{width:48px;height:48px;margin-bottom:12px}
    #panel{padding-top:calc(28px + var(--safe-t));padding-bottom:calc(20px + var(--safe-b))}
    #pStats{grid-template-columns:1fr 1fr 1fr}#pType{margin-bottom:14px}#pDesc{line-height:1.55;margin-bottom:10px}}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;
    animation-iteration-count:1 !important;transition-duration:.01ms !important}}
</style>
</head>
<body>

<canvas id="sky" aria-label="Интерактивная карта Солнечной системы"></canvas>
<div id="hint">Нажмите на планету или Солнце, чтобы узнать больше</div>

<aside id="panel" role="dialog" aria-modal="false" aria-labelledby="pName">
  <button id="close" aria-label="Закрыть панель">✕</button>
  <div class="orb" id="orb" aria-hidden="true"></div>
  <h2 id="pName">—</h2>
  <p id="pType">—</p>
  <div id="pStats"></div>
  <p id="pDesc"></p>
</aside>

const BG_STARS = [];
for (let i = 0; i < 800; i++) {
  BG_STARS.push({
    x: Math.random(), y: Math.random(),
    r: Math.random() * 1.3 + 0.2,
    b: Math.random() * 0.6 + 0.2,

}

function buildConstellationStars() {
  const arr = [];
  for (const c of CONSTELLATIONS) {
    for (const [x, y] of c.stars) {
      arr.push({ x, y, r: 1.8 + Math.random() * 1.2, b: 0.7 + Math.random() * 0.3, ph: Math.random() * TAU });
    }
  }
  return arr;
}
const CONST_STARS = buildConstellationStars();

function createPlanetTexture(p) {
  const size = 256;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');

  const grad = g.createRadialGradient(
    size*0.35, size*0.32, size*0.05,
    size*0.5, size*0.5, size*0.7
  );
  grad.addColorStop(0, p.light);
  grad.addColorStop(0.4, p.color);
  grad.addColorStop(1, p.dark);
  g.fillStyle = grad;
  g.fillRect(0, 0, size, size);

  if (p.bands) {
    for (let i = 0; i < 14; i++) {
      const y = Math.random() * size;
      const h = size * (0.02 + Math.random() * 0.05);
      g.globalAlpha = 0.15 + Math.random() * 0.15;
      g.fillStyle = i % 2 ? p.dark : p.light;
      g.fillRect(0, y, size, h);
    }
    g.globalAlpha = 1;
    if (p.name === 'Юпитер') {
      g.beginPath();
      g.ellipse(size*0.62, size*0.58, size*0.07, size*0.045, 0, 0, TAU);
      g.fillStyle = 'rgba(200,80,50,0.55)';
      g.fill();
    }
  }

  if (p.land) {
    g.globalAlpha = 0.7;
    g.fillStyle = '#3a8a4a';
    const blobs = [
      [0.25,0.35,0.22,0.18],[0.5,0.3,0.15,0.22],[0.7,0.4,0.2,0.15],
      [0.35,0.6,0.18,0.2],[0.65,0.65,0.22,0.18],[0.15,0.5,0.12,0.15],
      [0.55,0.15,0.18,0.1],[0.85,0.55,0.12,0.2]
    ];
    for (const [bx, by, bw, bh] of blobs) {
      g.beginPath();
      g.ellipse(bx*size, by*size, bw*size, bh*size, Math.random()*1, 0, TAU);
      g.fill();
    }
    g.globalAlpha = 0.5;
    g.fillStyle = '#c8dff0';
    g.beginPath(); g.ellipse(size*0.5, size*0.05, size*0.4, size*0.06, 0, 0, TAU); g.fill();
    g.beginPath(); g.ellipse(size*0.5, size*0.95, size*0.4, size*0.06, 0, 0, TAU); g.fill();
    g.globalAlpha = 1;
  }

  if (p.name === 'Марс') {
    g.globalAlpha = 0.6;
    g.fillStyle = '#e8e8f0';
    g.beginPath(); g.ellipse(size*0.5, size*0.06, size*0.3, size*0.05, 0, 0, TAU); g.fill();
    g.beginPath(); g.ellipse(size*0.5, size*0.94, size*0.25, size*0.04, 0, 0, TAU); g.fill();
    g.globalAlpha = 0.3;
    g.fillStyle = '#6a2a10';
    for (let i = 0; i < 20; i++) {
      const x = Math.random()*size, y = Math.random()*size;
      g.beginPath(); g.arc(x, y, size*0.01 + Math.random()*size*0.03, 0, TAU); g.fill();
    }
    g.globalAlpha = 1;
  }

  if (p.name === 'Меркурий') {
    g.globalAlpha = 0.35;
    g.fillStyle = '#4a4038';
    for (let i = 0; i < 40; i++) {
      const x = Math.random()*size, y = Math.random()*size;
      const r = size*0.005 + Math.random()*size*0.025;
      g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
    }
    g.globalAlpha = 1;
  }

  if (p.name === 'Венера') {
    g.globalAlpha = 0.2;
    for (let i = 0; i < 12; i++) {
      const y = Math.random()*size;
      g.fillStyle = i % 2 ? '#c89a50' : '#f0d090';
      g.fillRect(0, y, size, size*0.04);
    }
    g.globalAlpha = 1;
  }

  return c;
}

  },

    light:'#fff3d4', color:'#c9a878', dark:'#4a3520', bands:true,

    stats:[
      ['Диаметр','139 820 км'],['Масса','318 масс Земли'],
      ['От Солнца','778,5 млн км'],['Год','11,86 лет'],

  },
  {

    light:'#fff0cf', color:'#d6bd8d', dark:'#4a3a1e', bands:true, ring:true,
    type:'Газовый гигант',
    stats:[
      ['Диаметр','116 460 км'],['Масса','95 масс Земли'],
      ['От Солнца','1,43 млрд км'],['Год','29,5 лет'],

  },
  {
    name:'Уран', dist:0.775, r:0.0205, period:84.011,
    light:'#d6f7fb', color:'#8fd3dc', dark:'#1b4a55',

    stats:[
      ['Диаметр','50 724 км'],['Масса','14,5 масс Земли'],
      ['От Солнца','2,87 млрд км'],['Год','84 года'],
      ['Сутки','17 ч 14 мин'],['Температура','−195 °C'],
      ['Наклон оси','97,8°'],['Спутники','28']
    ],
    desc:'Единственная планета, лежащая «на боку»: её ось наклонена почти на 98°, поэтому полюса по 42 года находятся то на свету, то в тени. Метан в атмосфере поглощает красный свет и придаёт планете бирюзовый оттенок. Здесь зафиксирована самая низкая температура в системе — до −224 °C.'
  },
  {
    name:'Нептун', dist:0.89, r:0.0198, period:164.79,

    stats:[
      ['Диаметр','49 244 км'],['Масса','17 масс Земли'],
      ['От Солнца','4,50 млрд км'],['Год','164,8 лет'],
      ['Сутки','16 ч 06 мин'],['Температура','−201 °C'],
      ['Ветер','до 2 100 км/ч'],['Спутники','16']
    ],
    desc:'Самая удалённая планета и самая ветреная — скорость ветра достигает 2 100 км/ч. Нептун был вычислен «на кончике пера» по возмущениям орбиты Урана и открыт в 1846 году. Крупнейший спутник, Тритон, движется в обратную сторону и, скорее всего, является захваченным объектом пояса Койпера.'
  }
];

PLANETS.forEach((p, i) => {
  p.angle = i * 2.39996;
  p.speed = 0.30 / Math.pow(p.period, 0.55);
  p.texture = createPlanetTexture(p);
});

let W = 0, H = 0, cx = 0, cy = 0, maxR = 0, sunR = 0;
const dpr = Math.min(window.devicePixelRatio || 1, 2);

function resize() {
  W = canvas.clientWidth;
  H = canvas.clientHeight;
  canvas.width  = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx = W / 2; cy = H / 2;
  maxR = Math.min(W, H) * 0.44;
  sunR = Math.max(16, maxR * 0.075);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));

function drawBackground(t) {
  ctx.fillStyle = '#04050a';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const mw = ctx.createLinearGradient(0, H*0.1, W, H*0.9);
  mw.addColorStop(0, 'rgba(30,40,80,0)');
  mw.addColorStop(0.3, 'rgba(40,50,100,0.04)');
  mw.addColorStop(0.5, 'rgba(50,60,120,0.07)');
  mw.addColorStop(0.7, 'rgba(40,50,100,0.04)');
  mw.addColorStop(1, 'rgba(30,40,80,0)');
  ctx.fillStyle = mw;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();

  for (const s of BG_STARS) {
    const a = s.b * (0.7 + 0.3 * Math.sin(t * 1.2 + s.ph));
    ctx.globalAlpha = a;
    ctx.fillStyle = '#c8d8f0';
    ctx.beginPath();
    ctx.arc(s.x * W, s.y * H, s.r, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawConstellations(t) {
  for (const c of CONSTELLATIONS) {
    ctx.beginPath();
    for (let i = 0; i < c.stars.length - 1; i++) {
      const [x1, y1] = c.stars[i];
      const [x2, y2] = c.stars[i + 1];
      ctx.moveTo(x1 * W, y1 * H);
      ctx.lineTo(x2 * W, y2 * H);
    }
    ctx.strokeStyle = 'rgba(100,150,220,0.12)';
    ctx.lineWidth = 0.7;
    ctx.stroke();
  }

  for (let ci = 0; ci < CONST_STARS.length; ci++) {
    const s = CONST_STARS[ci];
    const a = s.b * (0.75 + 0.25 * Math.sin(t * 1.5 + s.ph));
    ctx.globalAlpha = a;
    ctx.fillStyle = '#e8f0ff';
    ctx.beginPath();
    ctx.arc(s.x * W, s.y * H, s.r, 0, TAU);
    ctx.fill();

    ctx.globalAlpha = a * 0.3;
    ctx.beginPath();
    ctx.arc(s.x * W, s.y * H, s.r * 3, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.font = '10px "Segoe UI", system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(140,180,240,0.25)';
  for (const c of CONSTELLATIONS) {
    const mid = c.stars[Math.floor(c.stars.length / 2)];
    ctx.fillText(c.name, mid[0] * W + 6, mid[1] * H - 6);
  }
}

function drawOrbits() {
  ctx.lineWidth = 1;
  for (const p of PLANETS) {
    ctx.beginPath();
    ctx.arc(cx, cy, p.dist * maxR, 0, TAU);
    ctx.strokeStyle = 'rgba(120,165,255,0.10)';
    ctx.stroke();
  }
}

function drawSun(t) {
  const pulse = 1 + Math.sin(t * 1.6) * 0.02 + Math.sin(t * 3.3) * 0.012;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(cx, cy, sunR * 0.6, cx, cy, sunR * 7.5 * pulse);
  g.addColorStop(0, 'rgba(255,190,80,0.55)');
  g.addColorStop(0.22, 'rgba(255,130,30,0.18)');
  g.addColorStop(0.55, 'rgba(255,90,10,0.06)');
  g.addColorStop(1, 'rgba(255,70,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(cx, cy, sunR * 7.5 * pulse, 0, TAU);
  ctx.fill();
  ctx.restore();

  const core = ctx.createRadialGradient(
    cx - sunR * 0.18, cy - sunR * 0.18, sunR * 0.08, cx, cy, sunR
  );
  core.addColorStop(0, '#fffdf0');
  core.addColorStop(0.40, '#ffe27a');
  core.addColorStop(0.75, '#ffab33');
  core.addColorStop(1, '#ff6a00');
  ctx.fillStyle = core;
  ctx.beginPath();
  ctx.arc(cx, cy, sunR, 0, TAU);
  ctx.fill();
}

function drawRing(x, y, r, front) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(-0.38);
  ctx.scale(1, 0.34);
  ctx.beginPath();
  if (front) ctx.arc(0, 0, r * 2.05, 0, Math.PI);
  else       ctx.arc(0, 0, r * 2.05, Math.PI, TAU);
  ctx.strokeStyle = 'rgba(232,214,182,0.50)';
  ctx.lineWidth = r * 0.95;
  ctx.stroke();
  ctx.beginPath();
  if (front) ctx.arc(0, 0, r * 1.55, 0, Math.PI);
  else       ctx.arc(0, 0, r * 1.55, Math.PI, TAU);
  ctx.strokeStyle = 'rgba(255,244,214,0.30)';
  ctx.lineWidth = r * 0.20;
  ctx.stroke();
  ctx.restore();
}

function drawPlanet(p, t) {
  const ang = p.angle + t * p.speed;
  const d = p.dist * maxR;
  const x = cx + Math.cos(ang) * d;
  const y = cy + Math.sin(ang) * d;
  const r = Math.max(3.4, p.r * maxR);

  p._x = x; p._y = y; p._r = r;

  const ux = Math.cos(ang), uy = Math.sin(ang);

  if (p.ring) drawRing(x, y, r, false);

  ctx.save();
  ctx.beginPath();
  ctx.arc(x, y, r, 0, TAU);
  ctx.clip();

  ctx.drawImage(p.texture, x - r, y - r, r * 2, r * 2);

  const sx = x + ux * r * 0.62, sy = y + uy * r * 0.62;
  const sg = ctx.createRadialGradient(sx, sy, r * 0.08, sx, sy, r * 1.95);
  sg.addColorStop(0, 'rgba(0,0,0,0.78)');
  sg.addColorStop(0.50, 'rgba(0,0,0,0.30)');
  sg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = sg;
  ctx.fillRect(x - r, y - r, 2 * r, 2 * r);

  const hg = ctx.createRadialGradient(
    x - ux * r * 0.55, y - uy * r * 0.55, 0,
    x - ux * r * 0.55, y - uy * r * 0.55, r * 0.9
  );
  hg.addColorStop(0, 'rgba(255,255,255,0.38)');
  hg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = hg;
  ctx.fillRect(x - r, y - r, 2 * r, 2 * r);

  ctx.restore();

  if (p.ring) drawRing(x, y, r, true);
}

const panel  = document.getElementById('panel');
const orbEl  = document.getElementById('orb');
const nameEl = document.getElementById('pName');
const typeEl = document.getElementById('pType');
const statEl = document.getElementById('pStats');
const descEl = document.getElementById('pDesc');
const hint   = document.getElementById('hint');

let selected = null;
const pointer = { x: -9999, y: -9999, active: false };

function hitTest(mx, my) {
  for (const p of PLANETS) {
    if (p._x === undefined) continue;
    const dx = mx - p._x, dy = my - p._y;
    const minR = Math.max(p._r + 14, 22);
    if (dx * dx + dy * dy < minR * minR) return p;
  }
  const dx = mx - cx, dy = my - cy;
  const sr = sunR + 12;
  if (dx * dx + dy * dy < sr * sr) return SUN;
  return null;
}

function getLocal(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

canvas.addEventListener('mousemove', e => {
  const p = getLocal(e);
  pointer.x = p.x; pointer.y = p.y; pointer.active = true;
});
canvas.addEventListener('mouseleave', () => {
  pointer.active = false; pointer.x = pointer.y = -9999;
});
canvas.addEventListener('click', e => {
  const p = getLocal(e);
  const hit = hitTest(p.x, p.y);
  if (hit) { selected = hit; openInfo(hit); }
});
canvas.addEventListener('touchstart', e => {
  if (e.touches.length !== 1) return;
  const p = getLocal(e.touches[0]);
  pointer.x = p.x; pointer.y = p.y; pointer.active = true;
}, { passive: true });
canvas.addEventListener('touchend', e => {
  if (e.changedTouches.length !== 1) return;
  const p = getLocal(e.changedTouches[0]);
  pointer.x = p.x; pointer.y = p.y; pointer.active = false;
  const hit = hitTest(p.x, p.y);
  if (hit) { selected = hit; openInfo(hit); }
}, { passive: true });

function openInfo(obj) {
  nameEl.textContent = obj.name;
  typeEl.textContent = obj.type;
  orbEl.style.setProperty('--accent', obj.color);
  panel.style.setProperty('--accent', obj.color);
  statEl.innerHTML = obj.stats
    .map(s => `<div class="stat"><span>${s[0]}</span><b>${s[1]}</b></div>`)
    .join('');
  descEl.textContent = obj.desc;
  panel.classList.add('open');
  panel.scrollTop = 0;
  hint.classList.add('hide');
}

document.getElementById('close').addEventListener('click', () => {
  panel.classList.remove('open'); selected = null;
});
canvas.addEventListener('dblclick', () => {
  panel.classList.remove('open'); selected = null;
});
window.addEventListener('keydown', e => {
  if (e.key === 'Escape' && panel.classList.contains('open')) {
    panel.classList.remove('open'); selected = null;
  }
});

let lastFrame = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (now - lastFrame < 1000 / 60) return;
  lastFrame = now;

  const t = now / 1000;

  drawBackground(t);
  drawConstellations(t);
  drawOrbits();
  drawSun(t);

  for (const p of PLANETS) drawPlanet(p, t);

  if (selected && selected !== SUN && selected._x !== undefined) {
    ctx.beginPath();
    ctx.arc(selected._x, selected._y, selected._r + 9, 0, TAU);
    ctx.strokeStyle = 'rgba(150,200,255,0.55)';
    ctx.lineWidth = 1.2;
    ctx.setLineDash([4, 5]);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  if (pointer.active) {
    const hit = hitTest(pointer.x, pointer.y);
    canvas.style.cursor = hit ? 'pointer' : 'default';
    if (hit && hit !== SUN && hit._x !== undefined) {
      ctx.beginPath();
      ctx.arc(hit._x, hit._y, hit._r + 8, 0, TAU);
      ctx.strokeStyle = 'rgba(180,215,255,0.30)';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.font = '500 12.5px "Segoe UI", system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(210,228,255,0.9)';
      ctx.fillText(hit.name, hit._x, hit._y - hit._r - 16);
    }
    if (hit === SUN) {
      ctx.font = '500 12.5px "Segoe UI", system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(255,225,170,0.95)';
      ctx.fillText('Солнце', cx, cy - sunR - 16);
    }
  }
}

resize();
requestAnimationFrame(frame);

})();
</script>
